<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>CampusGet - Software Projects with Source Code, Notes & Placement Prep</title>
    <meta name="title" content="CampusGet - Software Projects with Source Code, Notes & Placement Prep" />
    <meta name="description" content="CampusGet provides production-ready software projects with full source code, PPT, documentation & setup guides. Get 100% free university notes, AKTU/VTU PYQs, and placement interview roadmaps." />
    <meta name="keywords" content="software projects with source code, final year college projects, MERN stack projects, Python AI projects, free notes, AKTU notes, PYQs, placement preparation e-books, SQL interview questions, DSA sheets, CampusGet" />
    <meta name="author" content="CampusGet" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="color-scheme" content="dark" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://campusget.vercel.app/" />

    <!-- Favicon & Icons -->
    <link rel="icon" type="image/png" href="/campusget-icon-light-tile.png" />
    <link rel="apple-touch-icon" href="/campusget-icon-light-tile.png" />

    <!-- Open Graph / Facebook / LinkedIn / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://campusget.vercel.app/" />
    <meta property="og:site_name" content="CampusGet" />
    <meta property="og:title" content="CampusGet - Software Projects with Source Code, Notes & Placement Prep" />
    <meta property="og:description" content="Production-ready software projects with source code, university notes, AKTU/VTU PYQs, and placement interview roadmaps." />
    <meta property="og:image" content="https://campusget.vercel.app/campusget-icon-light-tile.png" />
    <meta property="og:image:alt" content="CampusGet Educational Marketplace Logo" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://campusget.vercel.app/" />
    <meta name="twitter:site" content="@campusget" />
    <meta name="twitter:title" content="CampusGet - Software Projects with Source Code, Notes & Placement Prep" />
    <meta name="twitter:description" content="Production-ready software projects with source code, university notes, AKTU/VTU PYQs, and placement interview roadmaps." />
    <meta name="twitter:image" content="https://campusget.vercel.app/campusget-icon-light-tile.png" />

    <!-- Google Search Console Verification Placeholder -->
    <!-- Replace content with your verification code from Google Search Console -->
    <meta name="google-site-verification" content="GOOGLE_VERIFICATION_TOKEN" />

    <!-- Fonts & External Scripts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <!-- Global JSON-LD Structured Data: WebSite with Sitelinks SearchBox -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "CampusGet",
      "url": "https://campusget.vercel.app/",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://campusget.vercel.app/projects?search={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Global JSON-LD Structured Data: Educational Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "EducationalOrganization",
      "name": "CampusGet",
      "url": "https://campusget.vercel.app/",
      "logo": "https://campusget.vercel.app/campusget-icon-light-tile.png",
      "sameAs": [
        "https://instagram.com/campusget.in",
        "https://github.com/campusget",
        "https://youtube.com/@campusget"
      ],
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "Customer Support",
        "email": "campusget.in@gmail.com",
        "availableLanguage": ["English", "Hindi"]
      },
      "description": "Production-style software projects with complete source code & setup guides, placement prep guides, career roadmaps, and free study materials."
    }
    </script>
  </head>
  <body class="bg-background text-gray-100 antialiased selection:bg-primary-500 selection:text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
